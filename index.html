<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#101010" id="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workflow">
<title>Workflow поръчки</title>
<script>
  // apply the saved theme before anything is drawn, so the screen does not flash
  try { const t = localStorage.getItem('wf-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (x) { /* optional */ }
</script>
<style>
:root{
  /* Layout: one phone column, bottom tab bar, order cards with a contrasting header band; details open as a popup.
     Palette: white, black and red, one step softer than pure so it stays lively without glaring. */
  --bg:#F0EFEC; --surface:#FFFFFF; --ink:#161616; --soft:#5F5D59; --line:#D2CFCA;
  --accent:#CB2B32; --on-accent:#FFFFFF; --tint:#EDEBE7; --blue:#1E5FC2;
  --band:#1A1A1A; --on-band:#F7F5F1;
  --bad:#B3222A; --bad-tint:#F9E3E3;
  --next:#2E9A55; --photo:#C99A06;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101010; --surface:#1C1C1C; --ink:#F0EEEA; --soft:#A9A6A0; --line:#383736;
    --accent:#D8373E; --on-accent:#FFFFFF; --tint:#282727; --blue:#6EA6FF;
    --band:#ECE9E4; --on-band:#151515;
    --bad:#F58388; --bad-tint:#3A1B1C;
    --next:#4CC174; --photo:#F2C230;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#101010; --surface:#1C1C1C; --ink:#F0EEEA; --soft:#A9A6A0; --line:#383736;
    --accent:#D8373E; --on-accent:#FFFFFF; --tint:#282727; --blue:#6EA6FF;
    --band:#ECE9E4; --on-band:#151515;
    --bad:#F58388; --bad-tint:#3A1B1C;
    --next:#4CC174; --photo:#F2C230;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:pan-y}
.scroll,.tbl-wrap{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:640px;margin:0 auto;overflow-x:clip;padding:calc(14px + env(safe-area-inset-top, 0px)) 14px calc(170px + env(safe-area-inset-bottom, 0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.fbtn{appearance:none;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px}
.fbtn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.h-n{font-weight:600;color:var(--soft)}
.top-btns{display:flex;gap:8px}
.search{display:flex;align-items:center;gap:8px;margin:-2px 0 12px}
.search .field{flex:1}
.fnow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:-4px 0 12px;font-size:13px;color:var(--soft)}
.fnow .link{padding:4px 2px;font-size:13px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.top span{font-size:13px;color:var(--soft)}
.muted{color:var(--soft)}
.small{font-size:13px}
.empty{padding:36px 8px;text-align:center;color:var(--soft)}

/* inputs */
.field{display:block;width:100%;padding:10px 12px;font-size:15px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.field:focus{outline:none;border-color:var(--ink)}
label.lbl,.lbl{display:block;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--soft)}
.btn{appearance:none;min-height:46px;padding:0 16px;font-size:14.5px;font-weight:700;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:none;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn.dark{background:var(--ink);color:var(--surface)}
.btn.wide{width:100%}
.pn{color:var(--blue)}
.ret{margin-top:4px;color:#1f8a4c;font-weight:800;font-size:13px}
:root[data-theme="dark"] .ret{color:#4cc27f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ret{color:#4cc27f}}
.ret-btn{margin:8px 0 4px;background:#1f8a4c;color:#fff;min-height:40px;font-size:14px}
table.stock td{padding:5px 4px;font-size:13px}
table.stock tr.col td{padding-top:12px;text-align:left;font-weight:800;border-bottom:0}
table.stock tr.ord td{color:var(--soft)}
table.stock tr.after td:first-child{font-weight:800}
table.stock td.low{background:#f6c445;color:#1b1b1b;font-weight:800;border-radius:6px}
table.stock td.neg{background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:6px}
table.stock-in td{padding:4px 2px}
button.inv{appearance:none;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--soft);font:inherit;font-size:10.5px;font-weight:700;white-space:nowrap}
table.stock-in .field{min-height:40px;padding:0 4px;text-align:center}
.qp{display:flex;align-items:flex-start;gap:18px}
.qp-p{flex:1;min-width:0}
.qp-p .field{min-height:46px}
.dlist{max-height:216px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.dlist:empty{display:none}
.dcat{padding:9px 12px 3px;font-size:12px;font-weight:700;color:var(--soft)}
.dopt{display:block;width:100%;padding:9px 12px;border:0;background:none;color:var(--ink);font-size:14.5px;font-weight:600;text-align:left}
.cod{font-weight:800;font-size:16px}
.cod:empty{display:none}
#f-total{margin-top:12px}
.iprice{font-size:13.5px;font-weight:700}
.btn:disabled{opacity:.5}
.link{appearance:none;background:none;border:0;padding:8px 2px;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;min-height:40px;padding:7px 13px;font-weight:600;font-size:13.5px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{margin-left:6px;font-weight:800;opacity:.75}
.scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;margin:0 -14px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none}
.err{min-height:1.4em;margin-top:10px;font-weight:700;color:var(--bad)}

/* order cards */
.card{cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.card.urgent{border:2.5px solid var(--accent)}
.card-top{padding:10px 14px;background:var(--band);color:var(--on-band)}
.card-top .num,.card-top .src{color:var(--on-band);opacity:.72}
.card-top .badge{background:none;color:var(--on-band);box-shadow:inset 0 0 0 1.5px var(--on-band)}
.card-top .badge.urgent,.card-top .badge.late{background:var(--accent);color:var(--on-accent);box-shadow:none}
.card-top .badge.photo-req{background:#f2c94c;color:#1b1b1b;box-shadow:none}
.notice-ov{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:24px}
.notice{background:var(--surface);box-shadow:0 10px 40px rgba(0,0,0,.35);color:var(--ink);border-radius:18px;padding:26px 22px 20px;max-width:360px;width:100%;text-align:center;border:3px dashed #e0a800}
.notice .ico{font-size:44px;line-height:1}
.notice h2{font-size:24px;margin:10px 0 6px}
.notice p{margin:0 0 18px;color:var(--soft)}
td.miss{background:#f6c445;color:#1b1b1b;border-radius:6px;white-space:nowrap}
.miss-note{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:#fdf1cc;color:#3a2c00;font-weight:700;font-size:13px}
.card-top .badge.nosize{background:#e8a317;color:#1b1b1b;box-shadow:none}
.nosize-btn{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 12px;padding:11px 14px;border-radius:12px;border:2px dashed #e8a317;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.nosize-btn span{color:var(--soft);font-weight:600;font-size:13px}
.miss-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.miss-row:last-child{border-bottom:0}
.card-top .badge.bad{background:var(--on-band);color:var(--band);box-shadow:none}
.prod{padding:10px 14px;border-top:1px solid var(--line)}
.card-top + .prod{border-top:0}
.prod-name{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.dots{display:inline-flex;gap:4px;flex:none}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--soft)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.now{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.now-txt{display:flex;flex-direction:column;line-height:1.2}
.now-txt span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.now-txt b{font-size:15px;font-weight:800}
.go{appearance:none;flex:none;min-width:92px;min-height:42px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:14px}
.go.wait{background:none;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.ship{margin-top:8px;font-size:13.5px}
a{color:var(--ink)}
.ready{margin-top:6px;font-weight:700;color:var(--ink)}
.ready.waiting{color:var(--next)}
.more{appearance:none;display:block;width:100%;min-height:40px;border:0;border-top:1px solid var(--line);background:none;color:var(--soft);font-weight:700;font-size:13px}
.phone-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:12px;font-size:13.5px}
.viber{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:#7360F2;color:#FFFFFF;font-size:12.5px;font-weight:800;text-decoration:none}
.copy{appearance:none;flex:none;min-height:30px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:800}
.inline .copy{min-height:44px;border-radius:10px}
.phone-row .link{padding:4px 0;font-size:13px}
.item-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item-h .link{flex:none;padding:2px 0;font-size:13px}
.ie-h{margin-top:10px;font-weight:800}
.warn{margin-top:10px;font-weight:700;color:#B07F00}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px}
.cal-h{font-size:11px;font-weight:700;color:var(--soft);text-align:center;padding-bottom:2px}
.cal-c{min-height:46px;padding:3px;border-radius:6px;background:var(--tint);display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden}
.cal-x{background:none}
.cal-off{opacity:.45}
.cal-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-d{font-size:11px;font-weight:700;color:var(--soft)}
.cal-p{display:inline-block;padding:0 3px;border-radius:3px;font-size:10px;font-weight:800;line-height:14px;background:var(--ink);color:var(--bg)}
.cal-p.unpaid{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cal-p.sick{background:var(--accent);color:var(--on-accent)}
.cal-p.other{background:var(--soft);color:var(--bg)}
.cal-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:10px;font-size:11.5px;color:var(--soft)}
.block h2 .link{padding:0 8px;font-size:20px;text-decoration:none}
.hols{margin-top:6px}
.hol{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lv-field{flex:1;min-width:0}
.lv-count{margin-top:8px;font-weight:700}
.theme-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 4px;font-size:13px;color:var(--soft)}
.tchips{display:inline-flex;padding:2px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.tchip{appearance:none;min-height:28px;padding:0 10px;border:0;border-radius:999px;background:none;color:var(--soft);font-size:12px;font-weight:700}
.tchip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.flist{border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.frow{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:0;border-top:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;font-size:14px;font-weight:600}
.flist .frow:first-child{border-top:0}
.frow[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.frow[aria-pressed="true"] .frow-n{color:inherit;opacity:.75}
.frow.sub{padding-left:30px;font-weight:500;font-size:13.5px;min-height:40px}
.frow.fold{border:1.5px solid var(--line);border-radius:12px}
.frow-n{flex:none;font-size:12.5px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
.pills.on-list{margin:-4px 0 12px}
.pill{appearance:none;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px 0 12px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700}
.pill span{opacity:.7}
.fnow-n{font-size:12.5px;color:var(--soft);margin-left:4px}
.fdone{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom, 0px));background:var(--surface);border-top:1px solid var(--line)}
.fdone .btn{flex:1}
.sent{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-weight:700;color:var(--next)}
.sent .link{padding:2px 0;font-size:13px;color:var(--soft)}
.actions.send{margin-top:10px;flex-wrap:nowrap}
.actions.send .btn{flex:1;min-width:0;padding:0 10px;line-height:1.2}
.sec{display:flex;align-items:baseline;gap:6px;margin:6px 2px 10px;font-size:14px;font-weight:800;letter-spacing:.02em}
.star{margin-left:5px;color:#E0A100}
.prev{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--tint)}
.prev-h{font-size:12.5px;font-weight:800;color:var(--soft)}
.prev-row{appearance:none;display:block;width:100%;margin-top:6px;padding:0;border:0;background:none;color:var(--ink);text-align:left;font-size:13.5px}
button.prev-row{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.phone-hint{margin-top:6px;color:#B07F00;font-weight:700}
.phone-hint:empty{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.tile span{font-size:12px;font-weight:700;color:var(--soft)}
.tile b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.tile small{font-size:12px;color:var(--soft)}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:baseline}
.bar-l{font-weight:700;font-size:13.5px;overflow-wrap:anywhere}
.bar-v{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.bar-t{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--tint)}
.bar-t i{display:block;height:100%;border-radius:4px;background:var(--ink);opacity:.8}
.back{display:inline-block;margin:-4px 0 4px;padding:6px 0;font-size:13.5px;text-decoration:none}
.group{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px}
.group h2{padding:9px 14px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--band);color:var(--on-band)}
.group-toggle{appearance:none;display:flex;justify-content:space-between;width:100%;padding:12px 14px;border:0;background:none;color:var(--ink);font-weight:700;font-size:13.5px}
.group-toggle span{color:var(--soft)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.group h2 + .task{border-top:0}
.tick{appearance:none;flex:none;display:grid;place-items:center;width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--soft);background:none;color:var(--on-accent);font-weight:900;font-size:14px;line-height:1}
.tick.on{background:var(--next);border-color:var(--next)}
.task-main{appearance:none;flex:1;min-width:0;padding:0;border:0;background:none;color:inherit;text-align:left}
.task-title{display:block;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--soft)}
.task.done .task-title{text-decoration:line-through;color:var(--soft)}
.late{color:var(--accent);font-weight:700}
.task-h{margin-top:14px;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.task-note{margin-top:8px;white-space:pre-wrap}
.person{appearance:none;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:14.5px}
.group h2 + .person{border-top:0}
.person-n{flex:none;font-size:12.5px;color:var(--soft)}
.tbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;vertical-align:1px}
.notes{border-top:1px solid var(--line)}
.note{padding:8px 0;border-bottom:1px solid var(--line)}
.note b{font-size:13px}
.note time{margin-left:8px;font-size:12px;color:var(--soft)}
.note p{margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:12;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:616px;margin:0 auto;padding:10px 10px 10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.toast button{appearance:none;min-height:40px;padding:0 14px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:800}
.row1{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.num{font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.who{font-weight:800;font-size:15px}
.src{font-size:13px;color:var(--soft)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.badge{padding:3px 8px;font-size:12px;font-weight:700;border-radius:6px;background:var(--tint);color:var(--ink)}
.badge.urgent{background:var(--accent);color:var(--on-accent)}
.badge.wait{background:none;box-shadow:inset 0 0 0 1.5px var(--soft);color:var(--soft)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.late{background:var(--accent);color:var(--on-accent)}
.lines{list-style:none;margin:8px 0 0;padding:0;font-size:15px}
.lines li{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.lines em{flex:none;font-style:normal;font-weight:700;color:var(--soft)}
.card-body{padding:2px 16px 18px}
.pop{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.pop-in{width:100%;max-width:640px;max-height:88%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;background:var(--surface);border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom, 0px)}
.pop-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 12px 12px 16px;background:var(--band);color:var(--on-band)}
.pop-head .num,.pop-head .src{color:var(--on-band);opacity:.72}
.pop-x{appearance:none;flex:none;min-height:38px;padding:0 14px;border:0;border-radius:9px;background:var(--on-band);color:var(--band);font-weight:800;font-size:13.5px}
.problem{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bad-tint);color:var(--bad);font-weight:700}
.item{margin-top:14px}
.item h3{font-size:14.5px;font-weight:800}
.steps{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin-top:8px}
.step{appearance:none;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:50px;padding:7px 12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-weight:700;font-size:13.5px}
.step small{font-weight:500;font-size:11.5px;color:var(--soft)}
.step.wait{border-style:dashed;border-color:var(--soft)}
.step.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.step.done small{color:inherit;opacity:.75}
.step.done b::before{content:"✓ "}
.step.cur{border-color:var(--next)}
.step.photo{border-style:dashed;border-color:var(--photo)}
.step.photo.on{border-style:dashed;background:none;border-color:var(--photo);color:var(--photo)}
.step.photo.on small{color:inherit}
.sep{margin:16px 0 0;padding-top:12px;border-top:1.5px dashed var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* summary */
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg .chip{flex:1;padding:8px 6px;text-align:center}
.block{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.block h2{display:flex;justify-content:space-between;font-size:15px;font-weight:800}
.tbl-wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:13.5px}
th{font-size:12px;color:var(--soft)}
td:first-child,th:first-child{text-align:left;font-weight:700}
td.z{color:var(--line)}
td.v{font-weight:800}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 12px)}
.bar-in{display:flex;width:100%;max-width:640px}
.tab{appearance:none;flex:1;min-height:60px;padding:8px 2px;background:none;border:0;border-top:3px solid transparent;font-size:14px;font-weight:700;color:var(--soft)}
.tab[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(90px + env(safe-area-inset-bottom, 0px));transition:transform .15s;z-index:6;min-height:50px;padding:0 18px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:14.5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}

/* new order sheet */
.sheet{position:fixed;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;background:var(--bg)}
.sheet-in{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top, 0px)) 14px calc(40px + env(safe-area-inset-bottom, 0px))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet-top h2{font-size:19px;font-weight:800}
.draft{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.editor{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:4px 12px 14px;margin-top:10px}
.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700}
.qty b{min-width:32px;text-align:center;font-size:17px}
.inline{display:flex;gap:8px}
.inline .field{flex:1}
.auth{max-width:420px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top, 0px)) 18px 40px}
.auth h1{font-size:26px;font-weight:800;margin-bottom:4px}
</style>
</head>

<div id="sheet"></div>

async function loadAllOrders() {

function searchPool() {
  const map = new Map((allOrders || []).map(o => [o.id, o]));
  D.orders.forEach(o => map.set(o.id, o));
  return [...map.values()];
}
const norm = v => String(v == null ? '' : v).toLowerCase();
function haystack(o) {
  const parts = [o.num, '#' + o.num, o.customer, o.recipient, o.phone, String(o.phone || '').replace(/\D/g, ''), o.address,
    o.price != null ? priceInput(o.price) + ' ' + o.price : '', o.brand, o.channel, o.account, o.note, o.problem, o.tracking, o.shop_name, o.delivery,
    ...(o.items || []).map(it => [catOf(it), it.design, it.name, it.size, it.color, it.note, it.sku].join(' ')),
    ...notesOf(o.id).map(n => n.body)];
  return norm(parts.join(' '));
}
function searchOrders(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return searchPool().filter(o => { const h = haystack(o); return terms.every(t => h.includes(t)); })
    .sort((a, b) => (!!a.waybill_at - !!b.waybill_at) || (b.num - a.num));
}

  if (!it) return;

  try {

    await Promise.all(stagesOf(it).filter(x => !x.done_at).map(x => api.update('item_stages', x.id, { done_at: now, done_by: me.id })));
  } catch (x) { toast('Не успях. Провери интернета и опитай пак.'); }
  toast('Взета от Returns');
  await reloadReturns(); await refresh(true);
}

async function loadStockMoves() {
  try { UI.stockMoves = { rows: await api.stockMoves() }; } catch (x) { UI.stockMoves = null; }

}
async function reloadStock() {
  try { D.stock = await api.loadStock(); } catch (x) { return; }

}
async function saveStock() {
  const S = UI.stockEdit, t = D.types.find(x => x.id === S.typeId);
  let rows = [];
  if (S.mode === 'load') {
    for (const k of Object.keys(S.vals)) {
      const raw = String(S.vals[k]).trim(); if (!raw) continue;
      const n = Number(raw);
      if (!Number.isInteger(n) || n < 0) { S.err = 'Пиши само цели числа.'; return renderPop(); }
      const [size, color] = k.split('|');
      if (n) rows.push({ product_type_id: t.id, size, color, delta: n, kind: 'load', created_by: me.id });
    }
    if (!rows.length) { S.err = 'Попълни поне едно число.'; return renderPop(); }
  } else if (S.mode === 'count') {
    // what was counted replaces what the app had: store only the differences; an empty box leaves that cell as it is
    for (const k of Object.keys(S.vals)) {
      const raw = String(S.vals[k]).trim(); if (raw === '') continue;
      const n = Number(raw);
      if (!Number.isInteger(n) || n < 0) { S.err = 'Пиши само цели числа.'; return renderPop(); }
      const [size, color] = k.split('|'), d = n - stockQty(t.id, size, color);
      if (d) rows.push({ product_type_id: t.id, size, color, delta: d, kind: 'count', created_by: me.id });
    }
    if (!rows.length) { UI.stockEdit = null; renderPop(); return toast('Няма промени'); }
  } else {
    if (!S.size || !S.color) { S.err = 'Избери размер и цвят.'; return renderPop(); }
    rows = [{ product_type_id: t.id, size: S.size, color: S.color, delta: -S.qty, kind: 'scrap', created_by: me.id }];
  }
  S.busy = true; S.err = ''; renderPop();
  try { await api.addStock(rows); }
  catch (x) { S.busy = false; S.err = 'Не успях да запазя. Провери интернета и опитай пак.'; return renderPop(); }
  const n = rows.reduce((a, r) => a + Math.abs(r.delta), 0);
  UI.stockEdit = null; renderPop();
  toast(S.mode === 'load' ? `Заредени ${n} бр.` : S.mode === 'count' ? 'Наличностите са обновени' : `Махнати ${n} бр. като брак`);
  await reloadStock();
}

const MONTHS = ['яну', 'фев', 'мар', 'апр', 'май', 'юни', 'юли', 'авг', 'сеп', 'окт', 'ное', 'дек'];
function periodRange(k) {
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if (k === 'today') return [new Date(y, m, now.getDate()), null];
  if (k === '7') return [new Date(y, m, now.getDate() - 6), null];
  if (k === 'month') return [new Date(y, m, 1), null];
  if (k === 'prev') return [new Date(y, m - 1, 1), new Date(y, m, 1)];
  if (k === '90') return [new Date(Date.now() - 90 * 864e5), null];
  return [null, null];
}
function barList(title, rows, fmt) {
  if (!rows.length) return '';
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<section class="block"><h2><span>${e(title)}</span></h2><div class="bars">${rows.map(r => `
    <div class="bar-row"><span class="bar-l">${e(r.k)}</span><span class="bar-v">${e(fmt(r))}</span>
      <span class="bar-t"><i style="width:${Math.max(2, Math.round(r.v / max * 100))}%"></i></span></div>`).join('')}</div></section>`;
}
function groupBy(list, keyFn) {
  const m = new Map();
  list.forEach(o => { const k = keyFn(o); if (!k) return; const g = m.get(k) || { k, n: 0, sum: 0 }; g.n++; g.sum += Number(o.price) || 0; m.set(k, g); });
  return [...m.values()].map(g => Object.assign(g, { v: g.n })).sort((a, b) => b.n - a.n || b.sum - a.sum);
}
function storeRows(list) {
  const m = new Map();
  const add = (k, sum) => { if (!k) return; const g = m.get(k) || { k, n: 0, sum: 0 }; g.n++; g.sum += Number(sum) || 0; m.set(k, g); };
  list.forEach(h => {
    if (h.brand !== 'Meivi') return add(h.brand, h.price);
    const its = h.items || [], tees = its.filter(i => i.is_tshirt), gifts = its.filter(i => !i.is_tshirt);
    const sum = l => l.reduce((a, i) => a + (lineSum(i) || 0), 0);
    if (tees.length && gifts.length) {
      if (!its.some(i => i.price != null)) return add('Meivi смесени', h.price);
      add('Meivi тениски', sum(tees)); return add('Meivi подаръци', sum(gifts));
    }
    add(tees.length ? 'Meivi тениски' : gifts.length ? 'Meivi подаръци' : 'Meivi', h.price);
  });
  return [...m.values()].map(g => Object.assign(g, { v: g.n })).sort((a, b) => b.n - a.n || b.sum - a.sum);
}
function viewStats() {

    </div>

    ${barList('Продукти (бройки)', prods, r => `${r.v} бр.`)}
    <section class="block"><h2><span>По месеци</span></h2><div class="tbl-wrap"><table>
      <thead><tr><th>Месец</th><th>Поръчки</th><th>Оборот</th></tr></thead>
      <tbody>${months.map(r => `<tr><td>${e(r.k)}</td><td class="${r.n ? 'v' : 'z'}">${r.n || '·'}</td><td class="${r.sum ? 'v' : 'z'}">${r.sum ? e(money(r.sum)) : '·'}</td></tr>`).join('')}</tbody>
    </table></div></section>

let LV = null;
const KIND = { paid: 'Платен', unpaid: 'Неплатен', sick: 'Болничен', other: 'Друго' };
const pad2 = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseDay = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const shortDay = s => parseDay(s).toLocaleDateString('bg-BG', { day: 'numeric', month: 'short' });
const range = l => l.start_date === l.end_date ? shortDay(l.start_date) : `${shortDay(l.start_date)} – ${shortDay(l.end_date)}`;
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const workweek = () => Number(((LV && LV.settings) || []).find(x => x.key === 'workweek')?.value || 5);
function holidaySet() { return new Set(((LV && LV.holidays) || []).map(h => h.day)); }
function isWorkDay(d, hol) { const w = d.getDay(); return (workweek() === 6 ? w !== 0 : w >= 1 && w <= 5) && !hol.has(isoDay(d)); }
function workDays(start, end, year) {
  if (!start || !end || end < start) return 0;
  const hol = holidaySet(); let n = 0;
  for (let d = parseDay(start), last = parseDay(end); d <= last; d.setDate(d.getDate() + 1)) {
    if (year && d.getFullYear() !== year) continue;
    if (isWorkDay(d, hol)) n++;
  }
  return n;
}
function yearSummary(uid, year) {
  const mine = ((LV && LV.leaves) || []).filter(l => l.user_id === uid && l.status === 'approved' && l.start_date <= `${year}-12-31` && l.end_date >= `${year}-01-01`);
  const used = { paid: 0, unpaid: 0, sick: 0, other: 0 };
  mine.forEach(l => { used[l.kind] += workDays(l.start_date, l.end_date, year); });
  const a = ((LV && LV.allowances) || []).find(x => x.user_id === uid && x.year === year);
  const total = a ? Number(a.days) + Number(a.carried) : null;
  return { mine: mine.sort((x, y) => (x.start_date < y.start_date ? -1 : 1)), used, a, total, left: total == null ? null : total - used.paid };
}

/* ---------- profile & personal tasks ---------- */
const openTask = t => !t.done_at;
const taskSort = (a, b) => (b.urgent - a.urgent) || ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0) || (a.created_at < b.created_at ? -1 : 1);
const myOpenCount = () => D.tasks.filter(t => t.assignee === (me && me.id) && openTask(t)).length;

function taskRow(t) {
  const late = t.due && !t.done_at && t.due < today();
  const o = t.order_id && findOrder(t.order_id);
  const meta = [
    t.urgent && !t.done_at ? '<span class="badge urgent">Спешна</span>' : '',
    t.due ? `<span class="${late ? 'late' : ''}">${late ? 'Закъснява · ' : 'до '}${e(day(t.due))}</span>` : '',
    o ? `<span>Поръчка #${o.num}${o.customer ? ' · ' + e(o.customer) : ''}</span>` : '',
    t.done_at ? `<span>✓ ${e(nameOf(t.done_by) || '')} · ${e(day(t.done_at))}</span>` : ''
  ].filter(Boolean).join('');
  return `<div class="task ${t.done_at ? 'done' : ''}">
    <button class="tick ${t.done_at ? 'on' : ''}" data-act="task-done" data-id="${t.id}" aria-pressed="${!!t.done_at}" aria-label="${t.done_at ? 'Върни като неизпълнена' : 'Отметни като изпълнена'}">${t.done_at ? '✓' : ''}</button>
    <button class="task-main" data-act="task-open" data-id="${t.id}"><span class="task-title">${e(t.title)}</span>${meta ? `<span class="task-meta">${meta}</span>` : ''}</button>
  </div>`;
}
function taskGroup(title, list) {
  if (!list.length) return '';
  return `<section class="group"><h2>${e(title)}</h2>${list.slice().sort(taskSort).map(taskRow).join('')}</section>`;
}
function doneGroup(list) {
  if (!list.length) return '';
  const rows = UI.showDone ? list.slice().sort((a, b) => (a.done_at < b.done_at ? 1 : -1)).map(taskRow).join('') : '';
  return `<section class="group"><button class="group-toggle" data-act="show-done">Изпълнени (${list.length}) <span>${UI.showDone ? 'Скрий' : 'Покажи'}</span></button>${rows}</section>`;
}
function tasksOf(uid) {
  const mine = D.tasks.filter(t => t.assignee === uid);
  return { open: mine.filter(openTask), done: mine.filter(t => !openTask(t)) };
}

function startTask(id, preset) {
  const t = id && D.tasks.find(x => x.id === id);
  UI.task = { id: t ? t.id : null, err: '', draft: t
    ? { title: t.title, note: t.note, due: t.due || '', urgent: t.urgent, assignee: t.assignee, order_id: t.order_id || '' }
    : Object.assign({ title: '', note: '', due: '', urgent: false, assignee: me.id, order_id: '' }, preset || {}) };
  renderPop();
  if (!t) setTimeout(() => { const f = $('#t-title'); if (f) f.focus(); }, 50);
}
async function saveTask() {
  const T = UI.task, d = T.draft;
  if (!d.title.trim()) { T.err = 'Напиши какво трябва да се направи.'; return renderPop(); }
  const row = { title: d.title.trim(), note: d.note.trim(), due: d.due || null, urgent: !!d.urgent, order_id: d.order_id || null };
  if (isAdmin()) row.assignee = d.assignee || me.id;
  try {
    if (T.id) await api.update('tasks', T.id, row);
    else await api.insert('tasks', Object.assign({ assignee: me.id }, row));
    UI.task = null;
    await refresh(true);
  } catch (x) { T.err = 'Не успях да запазя задачата. Провери интернета и опитай пак.'; renderPop(); }
}

function formTotal() {
  const all = F.items.concat(F.edit.typeId ? [F.edit] : []).filter(it => parsePrice(it.price) != null);
  return all.length ? 'Наложен платеж: ' + money(all.reduce((a, it) => a + parsePrice(it.price) * it.qty, 0)) : '';
}
function addDraft() {
  const it = F.edit, t = typeOf(it.typeId);
  if (!it.typeId) return 'Избери продукт.';
  if (t && t.is_tshirt && designMissing(it)) return designMissing(it);
  if (t && t.is_tshirt && (!it.size || !it.color)) return 'Избери размер и цвят.';
  if (it.typeId === 'custom') {
    if (!it.name.trim()) return 'Напиши име на продукта.';
    it.stages.sort((a, b) => a.sort - b.sort);
  } else it.name = t.name;
  F.items.push(it);
  F.edit = blankItem();
  return '';
}
async function saveOrder() {
  if (F.edit.typeId) { const m = addDraft(); if (m) { F.err = m; return renderForm(); } }
  if (!F.items.length) { F.err = 'Добави поне един продукт.'; return renderForm(); }
  if (!F.brand || !F.channel) { F.err = 'Избери марка и канал.'; return renderForm(); }
  F.busy = true; F.err = ''; renderForm();
  try {
    await api.createOrder({
      customer: F.customer.trim(), phone: F.phone.trim(), recipient: F.recipient.trim(), address: F.address.trim(), price: '', brand: F.brand, channel: F.channel,
      account: F.brand === 'Meivi' && F.channel === 'TikTok' ? F.account : '',
      note: F.note.trim(), urgent: F.urgent, due: F.due, needs_confirm: !!F.confirm,
      items: F.items.map(it => ({
        product_type_id: it.typeId === 'custom' ? '' : it.typeId, name: it.name.trim(),
        is_tshirt: !!(typeOf(it.typeId) || {}).is_tshirt, size: it.size, color: it.color, qty: it.qty,
        custom_design: it.custom, note: it.note.trim(), price: priceStr(it.price), design: (it.design || '').trim(), stages: draftStages(it)
      }))
    });
    F = null; renderForm(); UI.tab = 'orders'; UI.filter = 'all';
    await refresh(true);
  } catch (x) { F.busy = false; F.err = 'Не успях да запазя поръчката. Провери интернета и опитай пак.'; renderForm(); }
}

/* ---------- actions ---------- */
/* ---------- keeping phones in sync without downloading everything ----------
   Full load only when the app opens. After that: live updates per changed order,
   plus a light catch-up (only rows changed since the last sync) on return to the
   app, after a dropped connection and every few minutes as a safety net. */
let lastSync = 0, pendingRedraw = false;
const RECENT_MS = 30 * 864e5;
const keepInList = o => !o.waybill_at || Date.now() - new Date(o.waybill_at).getTime() < RECENT_MS;
const lightOf = o => ({ id: o.id, num: o.num, customer: o.customer, phone: o.phone, price: o.price, brand: o.brand, channel: o.channel,
  account: o.account, created_at: o.created_at, waybill_at: o.waybill_at, tracking: o.tracking, items: (o.items || []).map(it => ({ name: it.name, qty: it.qty, is_tshirt: it.is_tshirt, price: it.price })) });
function upsert(list, row, key = 'id') { const i = list.findIndex(x => x[key] === row[key]); if (i >= 0) list[i] = row; else list.push(row); }
function mergeOrder(o) {
  if (keepInList(o)) upsert(D.orders, o); else D.orders = D.orders.filter(x => x.id !== o.id);
  upsert(D.history, lightOf(o));
  if (allOrders) upsert(allOrders, o);
}
function dropOrder(id) {
  D.orders = D.orders.filter(x => x.id !== id);
  D.history = D.history.filter(x => x.id !== id);
  D.notes = D.notes.filter(n => n.order_id !== id);
  if (allOrders) allOrders = allOrders.filter(x => x.id !== id);
}
function redraw(force) {
  const el = document.activeElement;
  if (!force && el && el.id === 'q') { updateResults(); return; }   // search results can refresh under the search box
  if (!force && el && el.closest && el.closest('#app, #pop') && /INPUT|TEXTAREA|SELECT/.test(el.tagName)) { pendingRedraw = true; return; }
  pendingRedraw = false;
  render();
  if (UI.searching) updateResults();
}
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRedraw) redraw(); }, 120));

async function fullLoad() {
  const t0 = Date.now();
  try { D = await api.load(); } catch (x) { return false; }
  lastSync = t0;
  redraw(true);
  return true;
}
let syncing = null;
async function sync() {
  if (!me) return;
  if (syncing) return syncing;
  syncing = (async () => {
    const t0 = Date.now();
    // two minutes of overlap so a slightly wrong phone clock cannot skip a change
    const since = new Date((lastSync || t0) - 120000).toISOString();
    try {
      const r = await api.syncSince(since);
      r.orders.forEach(mergeOrder);
      r.tasks.forEach(t => upsert(D.tasks, t));
      r.notes.forEach(n => upsert(D.notes, n));
      try { const [st, rt] = await Promise.all([api.loadStock(), api.loadReturns()]); D.stock = st; D.returns = rt; PLAN = null; } catch (x) { /* keep the old numbers */ }
      lastSync = t0;
    } catch (x) { /* offline: try again later */ }
  })();
  try { await syncing; } finally { syncing = null; }
}
async function refresh(force) { await sync(); redraw(force); }

// live updates: collect changed orders for a moment, then fetch just those
let orderQueue = new Set(), orderTimer = 0, configTimer = 0, liveDown = false;
function onOrderChange(ev) {
  if (ev.eventType === 'DELETE') { if (ev.old && ev.old.id) { dropOrder(ev.old.id); redraw(); } return; }
  if (!ev.new || !ev.new.id) return;
  orderQueue.add(ev.new.id);
  clearTimeout(orderTimer);
  orderTimer = setTimeout(async () => {
    const ids = [...orderQueue]; orderQueue = new Set();
    try { (await api.loadOrders(ids)).forEach(mergeOrder); } catch (x) { return; }
    redraw();
  }, 300);
}
function onTaskChange(ev) {
  if (ev.eventType === 'DELETE') D.tasks = D.tasks.filter(t => t.id !== (ev.old && ev.old.id));
  else if (ev.new && ev.new.id) upsert(D.tasks, ev.new);
  redraw();
}
function onNoteChange(ev) {
  if (ev.eventType === 'DELETE') D.notes = D.notes.filter(n => n.id !== (ev.old && ev.old.id));
  else if (ev.new && ev.new.id) upsert(D.notes, ev.new);
  redraw();
}
async function reloadConfig() {
  try { Object.assign(D, await api.loadConfig()); } catch (x) { return; }
  redraw();
}
let retTimer = 0;
function onReturnsChange() { clearTimeout(retTimer); retTimer = setTimeout(reloadReturns, 400); }
async function reloadReturns() { try { D.returns = await api.loadReturns(); } catch (x) { return; } PLAN = null; redraw(); if (UI.open || UI.retEdit) renderPop(); }
let stockTimer = 0;
function onStockChange() { clearTimeout(stockTimer); stockTimer = setTimeout(reloadStock, 400); }
function onConfigChange() { clearTimeout(configTimer); configTimer = setTimeout(reloadConfig, 400); }
function onLiveStatus(status) {
  if (status === 'SUBSCRIBED') { if (liveDown) { liveDown = false; refresh(); } }
  else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') liveDown = true;
}

// after my own change: apply what I know right away, then pick up the rest
async function act(fn, after) {
  try { await fn(); } catch (x) { /* the catch-up below shows the real state */ }
  if (after && after.dropOrder) dropOrder(after.dropOrder);
  if (after && after.dropTask) D.tasks = D.tasks.filter(t => t.id !== after.dropTask);
  if (after && after.config) await reloadConfig();
  await refresh(true);
}
const findOrder = id => D.orders.find(o => o.id === id);
let toastTimer = 0;
function toast(text, undoAct, id) {
  clearTimeout(toastTimer);
  $('#toast').innerHTML = `<div class="toast" role="status"><span>${e(text)}</span>${undoAct ? `<button data-act="${undoAct}" data-id="${id}" data-undo="1">Отмени</button>` : ''}</div>`;
  toastTimer = setTimeout(() => { $('#toast').innerHTML = ''; }, 6000);
}
function showNotice(icon, title, text) {
  const old = document.getElementById('notice'); if (old) old.remove();
  const d = document.createElement('div'); d.id = 'notice'; d.className = 'notice-ov';
  d.innerHTML = `<div class="notice" role="alertdialog" aria-label="${e(title)}"><div class="ico">${icon}</div><h2>${e(title)}</h2><p>${e(text)}</p><button class="btn wide" data-act="notice-ok">Разбрах</button></div>`;
  document.body.appendChild(d);
  if (navigator.vibrate) try { navigator.vibrate(200); } catch (x) {}
}
const stamp = on => (on ? { at: null, by: null } : { at: new Date().toISOString(), by: me.id });

function authMsg(x) {
  const m = String((x && x.message) || x);
  if (/Invalid login/i.test(m)) return 'Грешен имейл или парола.';
  if (/Database error/i.test(m)) return 'Невалиден код за достъп.';
  if (/not confirmed/i.test(m)) return 'Потвърди имейла от писмото, което получи, и влез отново.';
  if (/already registered/i.test(m)) return 'Този имейл вече има профил. Влез с него.';
  if (/password/i.test(m)) return 'Паролата трябва да е поне 6 знака.';
  if (/email/i.test(m)) return 'Провери имейл адреса.';
  return 'Нещо се обърка. Провери интернета и опитай пак.';
}

document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'auth-form') return;
  ev.preventDefault();
  // read every field BEFORE re-rendering, otherwise the values are lost
  const v = id => ($(id) ? $(id).value.trim() : '');
  const up = UI.authMode === 'up';
  const f = { name: v('#a-name'), email: v('#a-email'), pass: $('#a-pass').value, code: v('#a-code') };
  const put = () => { for (const [k, id] of [['name', '#a-name'], ['email', '#a-email'], ['pass', '#a-pass'], ['code', '#a-code']]) if ($(id)) $(id).value = f[k]; };
  if (!f.email || !f.pass || (up && (!f.name || !f.code))) { UI.authErr = 'Попълни всички полета.'; render(); return put(); }
  UI.busy = true; UI.authErr = ''; render(); put();
  try {
    me = up ? await api.signUp(f.email, f.pass, f.name, f.code) : await api.signIn(f.email, f.pass);
    UI.busy = false;
    await start();
  } catch (x) { UI.busy = false; UI.authErr = authMsg(x); render(); put(); }
});

    case 'auth-mode': UI.authMode = v; UI.authErr = ''; return render();
    case 'tab': UI.workPerson = null; UI.leavePerson = null; UI.leaveEdit = null; UI.stockEdit = null; UI.retEdit = null; if (v === 'stock' || v === 'missing') setTimeout(loadStockMoves, 0); if (v === 'work' && isAdmin()) setTimeout(loadWork, 0); if (v === 'leave' && isAdmin()) setTimeout(loadLeave, 0);
      if (v !== 'orders') { UI.searching = false; UI.q = ''; } UI.tab = v; UI.open = null; UI.fopen = false; UI.task = null; if (v === 'profile' && UI.tab !== 'settings') UI.person = UI.person; render(); lockY = null; return window.scrollTo(0, 0);
    case 'filter': UI.filter = v; return render();
    case 'brand': UI.brand = v; return render();
    case 'prod': UI.prod = v; UI.sub = 'all'; UI.prodOpen = false; return render();
    case 'sub': UI.sub = v; UI.filter = 'all'; return render();
    case 'done-mode': UI.doneMode = v; return render();
    case 'sum-mode': UI.sumMode = v; return render();
    case 'open': UI.task = null; UI.editPhone = null; UI.itemEdit = null; UI.open = id; return renderPop();
    case 'close-pop': if (!b.dataset.x && ev.target !== b) return; if (UI.stockEdit) { UI.stockEdit = null; return renderPop(); } if (UI.retEdit) { UI.retEdit = null; return renderPop(); } if (UI.leaveEdit) { UI.leaveEdit = null; return renderPop(); } UI.leavePerson = null; UI.itemEdit = null; UI.workPerson = null; if (UI.task) { UI.task = null; return renderPop(); } UI.open = null; UI.fopen = false; return renderPop();
    case 'filters': UI.fopen = true; return renderPop();
    case 'prod-open': UI.prodOpen = !UI.prodOpen; return renderPop();
    case 'prod-sub': UI.prod = v; UI.sub = b.dataset.sub; UI.prodOpen = false; return render();
    case 'only-urgent': UI.onlyUrgent = !UI.onlyUrgent; return render();
    case 'only-late': UI.onlyLate = !UI.onlyLate; return render();

      if (v === 'filter') UI.filter = 'all';
      if (v === 'brand') UI.brand = 'all';
      if (v === 'prod') { UI.prod = 'all'; UI.sub = 'all'; }
      if (v === 'urgent') UI.onlyUrgent = false;
      if (v === 'late') UI.onlyLate = false;
      return render();
    case 'search':
      if (UI.searching) { UI.searching = false; UI.q = ''; return render(); }
      UI.searching = true; render(); loadAllOrders();
      return setTimeout(() => { const q = $('#q'); if (q) q.focus(); }, 30);
    case 'search-x': UI.searching = false; UI.q = ''; return render();
    case 'f-clear': UI.onlyUrgent = false; UI.onlyLate = false; UI.brand = 'all'; UI.prod = 'all'; UI.sub = 'all'; UI.filter = 'all'; return render();
    case 'new': UI.open = null; renderPop(); return openForm();
    case 'ie-open': UI.armed = null; return startItemEdit(b.dataset.order, id || null);
    case 'ie-cancel': UI.itemEdit = null; return renderPop();
    case 'ie-save': return saveItemEdit();
    case 'ie-dpick': UI.itemEdit.draft.design = v; UI.itemEdit.draft.dq = v; setDList('ie', ''); return renderPop();
    case 'ie-size': UI.itemEdit.draft.size = v; return renderPop();
    case 'ie-color': UI.itemEdit.draft.color = v; return renderPop();
    case 'ie-qty': UI.itemEdit.draft.qty = Math.max(1, UI.itemEdit.draft.qty + Number(v)); return renderPop();
    case 'ie-stage': {
      const def = D.stageDefs.find(x => x.key === v), st = UI.itemEdit.draft.stages, i = st.findIndex(x => x.key === v);

    }
    case 'lv-year': UI.leaveYear = Number(v); return render();
    case 'lv-person': UI.leavePerson = id; return renderPop();
    case 'lv-new': return startLeaveEdit(null, id || null);
    case 'lv-edit': return startLeaveEdit(id);
    case 'lv-kind': UI.leaveEdit.draft.kind = v; return renderPop();
    case 'lv-save': return saveLeave();
    case 'lv-cancel': UI.leaveEdit = null; return renderPop();
    case 'lv-del': {
      const E = UI.leaveEdit;
      if (UI.armed !== 'leave:' + E.id) { UI.armed = 'leave:' + E.id; return renderPop(); }
      UI.armed = null; UI.leaveEdit = null;
      await leaveAct(() => api.remove('leaves', E.id));
      return toast('Отсъствието е изтрито');
    }
    case 'lv-month': {
      const now = new Date(), cur = (UI.leaveMonth || `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`).split('-').map(Number);
      const d = new Date(cur[0], cur[1] - 1 + Number(v), 1);
      UI.leaveMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
      return render();
    }
    case 'lv-ww': return leaveAct(() => api.upsert('app_settings', { key: 'workweek', value: v }));
    case 'lv-hols': UI.showHolidays = !UI.showHolidays; return render();
    case 'lv-hol-del': return leaveAct(() => api.removeBy('holidays', 'day', v));
    case 'lv-hol-add': {
      const day = $('#hol-day').value, name = $('#hol-name').value.trim();
      if (!day) return;
      return leaveAct(() => api.upsert('holidays', { day, name }));
    }
    case 'work-period': UI.workPeriod = v; return loadWork();
    case 'work-person': UI.workPerson = id; return renderPop();
    case 'theme': setTheme(v); return render();
    case 'stats-period': UI.statsPeriod = v; return render();
    case 'person': UI.person = id || null; UI.showDone = false; render(); return window.scrollTo(0, 0);
    case 'show-done': UI.showDone = !UI.showDone; return render();
    case 'task-new': return startTask(null, b.dataset.order ? { order_id: b.dataset.order } : (isAdmin() && UI.person ? { assignee: UI.person } : {}));
    case 'task-open': return startTask(id);
    case 'task-save': return saveTask();
    case 'task-done': {
      const t = D.tasks.find(x => x.id === id); if (!t) return;
      const p = stamp(t.done_at);
      if (p.at && !undo) toast('Задачата е изпълнена', 'task-done', id);
      if (UI.task) UI.task = null;
      return act(() => api.update('tasks', id, { done_at: p.at, done_by: p.by }));
    }
    case 'task-del':
      if (UI.armed !== 'task:' + id) { UI.armed = 'task:' + id; return renderPop(); }
      UI.armed = null; UI.task = null;
      return act(() => api.remove('tasks', id), { dropTask: id });
    case 'note-add': {
      const f = $(`#nt-${id}`), body = f ? f.value.trim() : '';
      if (!body) return;
      f.value = '';
      return act(() => api.insert('order_notes', { order_id: id, body }));
    }
    case 'logout': await api.signOut(); me = null; return render();
    case 'stage': {
      // Stages are a sequence: finishing one also finishes the ones before it,
      // and undoing one also undoes the ones after it.
      let it, s;
      D.orders.some(o => o.items.some(i => { const f = i.item_stages.find(x => x.id === id); if (f) { it = i; s = f; } return !!f; }));
      if (!s) return;
      const all = stagesOf(it), at = all.findIndex(x => x.id === id);
      const now = new Date().toISOString();
      const targets = s.done_at ? all.slice(at).filter(x => x.done_at) : all.slice(0, at + 1).filter(x => !x.done_at);
      const patch = s.done_at ? { done_at: null, done_by: null } : { done_at: now, done_by: me.id };
      // an order requested for photos goes to photos by itself once every product is made
      const o = D.orders.find(x => x.items.includes(it));
      const readyAfter = i => i === it ? !i.photo_at && all.slice(at + 1).every(x => x.done_at) : itemState(i).code === 'ready';
      if (!s.done_at && o && o.photo_req && !o.packed_at && !o.waybill_at && itemsOf(o).every(readyAfter)) {
        const now2 = new Date().toISOString();
        showNotice('📷', 'Предай за снимане', `#${o.num} ${o.customer || ''} е готова. Отбелязах я като изпратена за снимане.`);
        return act(() => Promise.all([
          ...targets.map(x => api.update('item_stages', x.id, patch)),
          ...itemsOf(o).map(i => api.update('items', i.id, { photo_at: now2, photo_by: me.id })),
          api.update('orders', o.id, { photo_req: false })
        ]));
      }
      if (!s.done_at && !undo) toast(`Отбелязано: ${s.name}`, 'stage', id);
      return act(() => Promise.all(targets.map(x => api.update('item_stages', x.id, patch))));
    }
    case 'photo': {
      let it; D.orders.some(o => (it = o.items.find(i => i.id === id)));
      const p = stamp(it && it.photo_at);
      if (!undo) toast(p.at ? 'Изпратено за снимане' : 'Върнато от снимане', 'photo', id);
      return act(() => api.update('items', id, { photo_at: p.at, photo_by: p.by }));
    }
    case 'confirm': { const p = stamp(findOrder(id).confirmed_at); if (p.at && !undo) toast('Отбелязано: потвърждение', 'confirm', id); return act(() => api.update('orders', id, { confirmed_at: p.at, confirmed_by: p.by })); }
    case 'pack': { const p = stamp(findOrder(id).packed_at); if (p.at && !undo) toast('Опакована · премести се в „Готови“', 'pack', id); return act(() => api.update('orders', id, { packed_at: p.at, packed_by: p.by })); }
    case 'send-open': {
      UI.task = null; UI.editPhone = null; UI.itemEdit = null; UI.open = id; renderPop();
      return setTimeout(() => { const f = $(`#trk-${id}`); if (f) { f.scrollIntoView({ block: 'center' }); f.focus(); } }, 60);
    }
    case 'send': {
      const o = findOrder(id), f = $(`#trk-${id}`), tracking = f ? f.value.trim() : '', quiet = v === 'quiet';
      if (!tracking && !quiet) { toast('Въведи номер на товарителница.'); if (f) f.focus(); return; }
      const now = new Date().toISOString();
      const patch = { tracking, waybill_at: now, waybill_by: me.id };
      if (!o.packed_at) { patch.packed_at = now; patch.packed_by = me.id; }
      // open Viber straight from the tap (phones block it if it waits), save at the same time
      if (o.phone && !quiet) {
        const msg = `Здравейте, Вашата поръчка от ${o.brand || 'нас'} е изпратена.\nНомер на пратката: ${tracking}\nБлагодарим ви!`;
        const url = `viber://chat?number=${encodeURIComponent(intlPhone(o.phone))}&draft=${encodeURIComponent(msg)}`;
        // on a computer the message is also copied, in case Viber opens without it
        if (!isPhone) copyText(msg);
        openExternal(url);
      }
      UI.open = null;
      toast(quiet || !o.phone ? 'Завършена' : isPhone ? 'Завършена · отварям Viber' : 'Завършена · отварям Viber (съобщението е и копирано)');
      return act(() => api.update('orders', id, patch));
    }
    case 'unsend': return act(() => api.update('orders', id, { waybill_at: null, waybill_by: null }));
    case 'waybill': {
      const o = findOrder(id), p = stamp(o.waybill_at);
      const patch = { waybill_at: p.at, waybill_by: p.by };
      if (p.at && !o.packed_at) { patch.packed_at = p.at; patch.packed_by = p.by; }
      UI.open = null;
      if (p.at && !undo) toast('Поръчката е изпратена', 'waybill', id);
      return act(() => api.update('orders', id, patch));
    }
    case 'photo-req': { const o = findOrder(id); toast(o.photo_req ? 'Заявката за снимане е махната' : 'Заявена за снимане · ще се изпрати, щом е готова'); return act(() => api.update('orders', id, { photo_req: !o.photo_req })); }
    case 'notice-ok': { const n = document.getElementById('notice'); if (n) n.remove(); return; }
    case 'urgent': return act(() => api.update('orders', id, { urgent: !findOrder(id).urgent }));
    case 'delete':
      if (UI.armed !== id) { UI.armed = id; return render(); }
      UI.armed = null; UI.open = null;
      return act(() => api.remove('orders', id), { dropOrder: id });
    case 'opt-add': {
      const val = $(`#new-${v}`).value.trim();
      if (!val || opts(v).some(o => o.value === val)) return;
      return act(() => api.insert('options', { kind: v, value: val, sort: opts(v).length + 1 }), { config: true });
    }
    case 'opt-del': return act(() => api.remove('options', id), { config: true });
    case 'nosize': UI.noSize = !!v; render(); return window.scrollTo(0, 0);
    case 'ret-open': { const tees = D.types.filter(t => t.is_tshirt); UI.retEdit = { typeId: tees.length ? tees[0].id : '', design: '', dq: null, custom: false, size: '', color: '', qty: 1, err: '' }; return renderPop(); }
    case 'ret-type': Object.assign(UI.retEdit, { typeId: v, design: '', dq: null, custom: false, size: '', color: '', err: '' }); return renderPop();
    case 'rt-dpick': UI.retEdit.design = v; UI.retEdit.dq = v; setDList('rt', ''); return renderPop();
    case 'ret-size': UI.retEdit.size = v; return renderPop();
    case 'ret-color': UI.retEdit.color = v; return renderPop();
    case 'ret-qty': UI.retEdit.qty = Math.max(1, UI.retEdit.qty + Number(v)); return renderPop();
    case 'ret-save': return saveReturn();
    case 'ret-take': return takeReturn(id);
    case 'ret-undo': return untakeReturn(id);
    case 'ret-del': {
      if (UI.armed !== 'ret:' + id) { UI.armed = 'ret:' + id; return render(); }
      UI.armed = null;
      try { await api.remove('returns', id); } catch (x) { return toast('Не успях. Провери интернета.'); }
      toast('Махнато'); return reloadReturns();
    }
    case 'stock-open': {
      const tees = D.types.filter(t => t.is_tshirt), t = (v === 'count' && tees.find(x => x.id === id)) || tees[0], vals = {};
      if (v === 'count' && t) t.colors.forEach(c => t.sizes.forEach(sz => { vals[sz + '|' + c] = String(stockQty(t.id, sz, c)); }));
      UI.stockEdit = { mode: v, typeId: t ? t.id : '', vals, size: '', color: '', qty: 1, err: '' }; return renderPop();
    }
    case 'stock-type': Object.assign(UI.stockEdit, { typeId: v, vals: {}, size: '', color: '', err: '' }); return renderPop();
    case 'stock-size': UI.stockEdit.size = v; return renderPop();
    case 'stock-color': UI.stockEdit.color = v; return renderPop();
    case 'stock-qty': UI.stockEdit.qty = Math.max(1, UI.stockEdit.qty + Number(v)); return renderPop();
    case 'stock-save': return saveStock();
    case 'stock-undo': {
      if (UI.armed !== 'mv:' + id) { UI.armed = 'mv:' + id; return render(); }
      UI.armed = null;
      try { await api.removeStockMove(Number(id)); } catch (x) { return toast('Не успях. Провери интернета.'); }
      toast('Махнато'); return reloadStock();
    }
    /* form */
    case 'f-close': F = null; return renderForm();
    case 'f-brand': F.brand = v; return renderForm();
    case 'f-channel': F.channel = v; return renderForm();
    case 'f-account': F.account = v; return renderForm();
    case 'f-icancel': F.edit = blankItem(); F.err = ''; return renderForm();
    case 'f-dpick': F.edit.design = v; F.edit.dq = v; setDList('f', ''); return renderForm();
    case 'f-size': F.edit.size = v; return renderForm();
    case 'f-color': F.edit.color = v; return renderForm();
    case 'f-qty': F.edit.qty = Math.max(1, F.edit.qty + Number(v)); return renderForm();
    case 'f-stage': {
      const def = D.stageDefs.find(s => s.key === v), st = F.edit.stages;
      const i = st.findIndex(s => s.key === v);
      if (i >= 0) st.splice(i, 1); else st.push({ key: def.key, name: def.name, kind: def.kind, sort: def.sort });
      return renderForm();
    }
    case 'f-stage-add': {
      const val = F.edit.extra.trim();
      if (val) { F.edit.stages.push({ key: 'custom', name: val, kind: 'work', sort: 1000 + F.edit.stages.length }); F.edit.extra = ''; }
      return renderForm();
    }
    case 'f-stage-x': F.edit.stages = F.edit.stages.filter(s => !(s.key === 'custom' && s.name === v)); return renderForm();
    case 'f-add': F.err = addDraft(); return renderForm();
    case 'f-rm': F.items.splice(Number(v), 1); return renderForm();
    case 'f-save': return saveOrder();
  }
});

document.addEventListener('touchmove', ev => { if (ev.target.classList && ev.target.classList.contains('pop')) ev.preventDefault(); }, { passive: false });
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.card[data-act=open]')) { ev.preventDefault(); UI.open = ev.target.dataset.id; renderPop(); }
  if (ev.key === 'Escape' && UI.leaveEdit) { UI.leaveEdit = null; renderPop(); }
  else if (ev.key === 'Escape' && UI.leavePerson) { UI.leavePerson = null; renderPop(); }
  else if (ev.key === 'Escape' && UI.workPerson) { UI.workPerson = null; renderPop(); }
  else if (ev.key === 'Escape' && UI.task) { UI.task = null; renderPop(); }
  else if (ev.key === 'Escape' && (UI.open || UI.fopen)) { UI.open = null; UI.fopen = false; renderPop(); }
});
document.addEventListener('input', ev => {
  if (ev.target.dataset.stock != null && UI.stockEdit) { UI.stockEdit.vals[ev.target.dataset.stock] = ev.target.value; return; }
  if (/^(f|ie|rt)-dq$/.test(ev.target.id)) return designTyped(ev.target);
  if (ev.target.id === 'rt-dname' && UI.retEdit) { UI.retEdit.design = ev.target.value; return; }
  const t = ev.target;
  if (UI.leaveEdit) {
    const k = { 'lv-start': 'start', 'lv-end': 'end', 'lv-note': 'note' }[t.id];
    if (k) {
      const d = UI.leaveEdit.draft; d[k] = t.value;
      if (k !== 'note') { if (k === 'start' && (!d.end || d.end < d.start)) { d.end = d.start; const en = $('#lv-end'); if (en) en.value = d.end; }
        const c = $('#lv-count'), n = workDays(d.start, d.end);
        if (c) c.textContent = d.start && d.end ? (d.end < d.start ? 'Крайната дата е преди началната.' : `${n} ${n === 1 ? 'работен ден' : 'работни дни'}`) : ''; }
      return;
    }
  }
  if (UI.itemEdit) {
    const k = { 'ie-name': 'name', 'ie-note': 'note', 'ie-extra': 'extra', 'ie-price': 'price', 'ie-dname': 'design' }[t.id];
    if (k) { UI.itemEdit.draft[k] = t.value; return; }
  }
  if (t.id === 'q') { UI.q = t.value; return updateResults(); }
  if (UI.task) {
    const k = { 't-title': 'title', 't-note': 'note', 't-due': 'due' }[t.id];
    if (k) { UI.task.draft[k] = t.value; return; }
  }
  if (!F) return;
  const map = { 'f-customer': 'customer', 'f-phone': 'phone', 'f-recipient': 'recipient', 'f-address': 'address', 'f-price': 'price', 'f-note': 'note', 'f-due': 'due' };
  if (map[t.id]) F[map[t.id]] = t.value;
  if (t.id === 'f-phone') { const h = $('#f-phone-hint'); if (h) h.innerHTML = phoneHint(t.value); }
  else if (t.id === 'f-name') F.edit.name = t.value;
  else if (t.id === 'f-dname') F.edit.design = t.value;
  else if (t.id === 'f-inote') F.edit.note = t.value;
  else if (t.id === 'f-iprice') { F.edit.price = t.value; const ft = $('#f-total'); if (ft) ft.textContent = formTotal(); }
  else if (t.id === 'f-extra') F.edit.extra = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (UI.leaveEdit && t.id === 'lv-user') { UI.leaveEdit.draft.user_id = t.value; return renderPop(); }
  if (UI.leaveEdit && (t.id === 'lv-start' || t.id === 'lv-end')) return renderPop();
  if (t.id === 'al-days' || t.id === 'al-carried') return saveAllowance(t.dataset.uid, t.id === 'al-days' ? 'days' : 'carried', t.value);
  if (UI.itemEdit) {
    if (t.id === 'ie-type') { const d = UI.itemEdit.draft, keep = { qty: d.qty, note: d.note, price: d.price }; UI.itemEdit.draft = Object.assign(blankItem(), keep, { typeId: t.value }); UI.itemEdit.err = ''; return renderPop(); }
    if (t.id === 'rt-custom' && UI.retEdit) { Object.assign(UI.retEdit, { custom: t.checked, design: '', dq: '' }); return renderPop(); }
    if (t.id === 'ie-custom') { UI.itemEdit.draft.custom = t.checked; UI.itemEdit.draft.design = ''; UI.itemEdit.draft.dq = ''; return renderPop(); }
    if (/^ie-/.test(t.id)) return;
  }
  if (UI.task) {
    if (t.id === 't-urgent') { UI.task.draft.urgent = t.checked; return; }
    if (t.id === 't-order') { UI.task.draft.order_id = t.value; return; }
    if (t.id === 't-assignee') { UI.task.draft.assignee = t.value; return; }
    if (t.id === 't-due') { UI.task.draft.due = t.value; return; }
  }
  if (F) {
    if (t.id === 'f-type') { const keep = F.edit.qty; F.edit = blankItem(); F.edit.typeId = t.value; F.edit.qty = keep; return renderForm(); }
    if (t.id === 'f-urgent') { F.urgent = t.checked; return; }
    if (t.id === 'f-confirm') { F.confirm = t.checked; return; }
    if (t.id === 'f-custom') { F.edit.custom = t.checked; F.edit.design = ''; F.edit.dq = ''; return renderForm(); }
    return;
  }
  if (t.dataset.field === 'price') { const v = parsePrice(t.value); t.value = priceInput(v); return act(() => api.update('orders', t.dataset.id, { price: v })); }
  // the tracking number is saved quietly, so a tap on "Изпрати" right after typing is not lost to a redraw
  if (t.dataset.field === 'tracking') { const o = findOrder(t.dataset.id), v = t.value.trim(); if (o) o.tracking = v; api.update('orders', t.dataset.id, { tracking: v }).catch(() => {}); return; }
  if (t.dataset.field === 'phone') { UI.editPhone = null; return act(() => api.update('orders', t.dataset.id, { phone: t.value.trim() })); }
  if (t.dataset.field) return act(() => api.update('orders', t.dataset.id, { [t.dataset.field]: t.value.trim() }));
  if (t.dataset.type) {
    const list = [...new Set(t.value.split(',').map(s => s.trim()).filter(Boolean))];
    return act(() => api.update('product_types', t.dataset.type, { [t.dataset.list]: list }), { config: true });
  }
});

/* ---------- self-update: load the newest version when one has been published ---------- */
async function checkVersion() {
  if (!/^http/.test(location.protocol) || F) return;
  const el = document.activeElement;
  if (el && /INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
  try {
    const r = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const latest = (await r.text()).trim();
    if (!latest || latest === VERSION) return;
    let tried = '';
    try { tried = sessionStorage.getItem('wf-tried') || ''; } catch (x) { /* optional */ }
    if (tried === latest) return;
    try { sessionStorage.setItem('wf-tried', latest); } catch (x) { /* optional */ }
    location.replace(location.pathname + '?v=' + encodeURIComponent(latest));
  } catch (x) { /* offline: keep the current version */ }
}

/* ---------- start ---------- */
let live = false;
async function start() {
  render();
  await fullLoad();
  if (!live) {
    live = true;
    api.subscribe({ orders: onOrderChange, tasks: onTaskChange, notes: onNoteChange, config: onConfigChange, stock: onStockChange, returns: onReturnsChange, status: onLiveStatus });
    // safety net in case a live update was missed: a light catch-up every 3 minutes while on screen
    setInterval(() => { if (!document.hidden) refresh(); }, 3 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    window.addEventListener('online', () => refresh());
  }
}
checkVersion();
setInterval(checkVersion, 5 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });
setTheme(themeNow());
(async () => {
  try { me = await api.session(); } catch (x) { me = null; }
  if (me) start(); else render();
})();
})();
</script>
